- type: entity
  id: LPPHammer
  parent: BaseItem
  name: assault hammer
  description: A hammer designed to quickly penetrate walls, floodgates, and also to crush someone's skulls.
  components:
  - type: Tag
    tags:
      - Hammer
  - type: Sprite
    sprite: _LP/Objects/Weapons/Melee/LPPHammer.rsi
    state: icon
  - type: Item
    size: Huge
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.75
    range: 1.70
    damage:
      types:
        Blunt: 10
        Structural: 30
    bluntStaminaDamageFactor: 2.00
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 10
        Structural: 80
  - type: ToolTileCompatible
  - type: Clothing
    sprite: _LP/Objects/Weapons/Melee/LPPHammer.rsi
    quickEquip: false
    slots:
    - back

- type: entity
  name: incomplete baseball bat
  parent: BaseItem
  id: LPPIncompleteBaseToolboxHammer
  description: A few planks of wood stuck together.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/incomplete_bat.rsi
    state: icon
  - type: Item
    size: Normal
    shape:
    - 0,0,0,3
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/incomplete_bat.rsi
    sprite: Objects/Weapons/Melee/incomplete_bat.rsi
  - type: Construction
    graph: LPPToolboxHammer
    node: incompleteHammer

- type: entity
  parent: BaseItem
  id: LPPToolboxHammer
  name: hammer
  description: The perfect tool for wanton carnage.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/sledgehammer.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 10
        Structural: 10
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 10
        Structural: 10
  - type: Item
    size: Large
  - type: Construction
    graph: LPPToolboxHammer
    node: lpphammer
