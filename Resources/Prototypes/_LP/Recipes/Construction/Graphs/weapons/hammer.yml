- type: constructionGraph
  id: LPPToolboxHammer
  start: start
  graph:
    - node: start
      edges:
        - to: incompleteHammer
          steps:
            - material: Steel
              amount: 4
              doAfter: 3
            - material: MetalRod
              amount: 2
              doAfter: 3
            - tag: Toolbox
              name: construction-graph-tag-glass-shard
              icon:
                sprite: Objects/Materials/Shards/shard.rsi
                state: shard1
              doAfter: 3
        
    - node: incompleteHammer
      entity: LPPIncompleteBaseToolboxHammer
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 5
            - !type:SpawnPrototype
              prototype: PartRodMetal1
              amount: 5
            - !type:SpawnPrototype
              prototype: ToolboxEmergency
              amount: 1
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 1
        - to: lpphammer
          completed:
          - !type:AdminLog
            message: "Construction"
            impact: High
          steps:
            - tool: Screwing
              doAfter: 6
            - tool: Anchoring
              doAfter: 5
            - tool: Welding
              doAfter: 15
        
    - node: lpphammer
      entity: LPPToolboxHammer
